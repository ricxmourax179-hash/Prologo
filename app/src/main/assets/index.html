<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>Prólogo — 01:03</title><link rel="stylesheet" href="style.css"></head><body>
<div id="wrap">
  <canvas id="game" width="360" height="640" aria-label="Minijogo do prólogo"></canvas>
  <div id="grain"></div>
  <div id="topbar"><div id="place">RUA SEM NOME</div><div id="clock">01:03</div></div>
  <div id="hint"></div>
  <div id="dialogue">
    <div id="speaker">VOCÊ</div>
    <div id="dialogueText"></div>
    <div id="next">TOQUE / E</div>
  </div>
  <div id="controls">
    <div id="stick"><div id="knob"></div></div>
    <div id="action">OLHAR</div>
  </div>
  <div id="fade"></div>
  <div id="start">
    <div class="box">
      <div class="eyebrow">PRÓLOGO</div>
      <div class="title">01:03</div>
      <div class="sub">Está chovendo. O último trem passa daqui a pouco.<br><br>Use o controle à esquerda para andar e o botão à direita para interagir.</div>
      <button class="uiBtn" id="startBtn">COMEÇAR</button>
    </div>
  </div>
  <div id="ending">
    <div class="box">
      <div class="eyebrow">01:07 — ESTAÇÃO</div>
      <div class="title" style="font-size:19px">BILHETE ADQUIRIDO</div>
      <div class="ticket">
        <div class="tiny">TRANSPORTE METROPOLITANO</div>
        <div class="big">[DESTINO]</div>
        <div class="rule"></div>
        <div class="tiny">EMBARQUE • 01:07 &nbsp;&nbsp; VIA • —</div>
      </div>
      <button class="uiBtn" id="continueBtn">CONTINUAR</button>
    </div>
  </div>
</div>
